<style>

<script>
/*
  FORMA AUTH / PREVIEW ISOLATION
  - ChatGPT/embedded previews do NOT load Firebase or JSZip.
  - A normal top-level hosted Forma page may load Firebase for real auth.
  - This keeps the preview lightweight while preserving production auth.
*/
window.FORMA_IS_EMBEDDED = (() => {
  try { return window.top !== window.self; } catch (e) { return true; }
})();
window.FORMA_FIREBASE_CONFIG = {
  apiKey: "PASTE_YOUR_FIREBASE_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
  appId: "PASTE_YOUR_FIREBASE_APP_ID"
};
window.FORMA_FIREBASE_READY = false;
window.FORMA_FIREBASE_PROMISE = Promise.resolve(false);
window.FORMA_JSZIP_PROMISE = Promise.resolve(false);

(function(){
  const cfg = window.FORMA_FIREBASE_CONFIG;
  const configured = cfg && !Object.values(cfg).some(v => String(v).includes("PASTE_YOUR_"));
  const load = (src) => new Promise((resolve,reject) => {
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>resolve(true);
    s.onerror=()=>reject(new Error('Could not load '+src));
    document.head.appendChild(s);
  });

  // Never load external auth SDKs inside an embedded preview.
  if (!window.FORMA_IS_EMBEDDED && configured) {
    window.FORMA_FIREBASE_PROMISE = load('https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js')
      .then(()=>load('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js'))
      .then(()=>{
        firebase.initializeApp(cfg);
        window.formaAuth=firebase.auth();
        window.FORMA_FIREBASE_READY=true;
        return true;
      })
      .catch(err=>{ console.warn('Forma Firebase unavailable:',err); return false; });
  }

  // JSZip is also lazy-loaded and never requested by the embedded preview.
  window.FORMA_JSZIP_PROMISE = Promise.resolve().then(()=>{
    if(window.FORMA_IS_EMBEDDED) return false;
    return load('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js')
      .then(()=>true).catch(err=>{ console.warn('Forma ZIP tool unavailable:',err); return false; });
  });
})();
</script></head><body>

let me=st.get('forma-session'),pending=null,am='up',firebaseUser=null,authBusy=false;

const firebaseReady=()=>!!(window.FORMA_FIREBASE_READY&&window.formaAuth);
window.FORMA_FIREBASE_PROMISE.then(()=>{ if(firebaseReady()){ acct(); } });
const localUsers=()=>st.get('forma-users')||{};
const authed=()=>firebaseReady()?!!firebaseUser:!!(me&&localUsers()[me]);

function authName(){
  if(firebaseReady()&&firebaseUser)return firebaseUser.displayName||firebaseUser.email?.split('@')[0]||'User';
  const u=me&&localUsers()[me];
  return u?.name||'User';
}

function acct(){
  const signed=authed(),name=authName();
  $('#hacc').innerHTML=signed
    ? '<span class="btn" style="cursor:default">'+ic('user',16)+e(name)+'</span><button class="btn" data-lo="1">Log out</button>'
    : '<button class="btn" data-au="in">Log in</button><button class="btn go" data-au="up">Sign up</button>';
  $('#ub').innerHTML=ic('user',16)+'Log out';
  $('#ub').title=signed?'Signed in as '+name:'';
}

function requireAuth(f){
  if(authed())f();
  else{pending=f;openAuth('up')}
}

function authError(err){
  const code=err&&err.code||'';
  const map={
    'auth/email-already-in-use':'That email is already registered. Try logging in.',
    'auth/invalid-email':'Enter a valid email address.',
    'auth/weak-password':'Use a stronger password (at least 8 characters).',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/user-not-found':'No account was found with that email.',
    'auth/wrong-password':'Incorrect email or password.',
    'auth/popup-closed-by-user':'Google sign-in was cancelled.',
    'auth/popup-blocked':'Your browser blocked the Google sign-in popup. Allow popups for Forma and try again.',
    'auth/operation-not-allowed':'This sign-in method is not enabled in Firebase yet.',
    'auth/unauthorized-domain':'This website domain is not authorized in Firebase Authentication.',
    'auth/network-request-failed':'Network error. Check your connection and try again.',
    'auth/too-many-requests':'Too many attempts. Wait a little and try again.'
  };
  return map[code]||err?.message||'Authentication failed. Please try again.';
}

  $('#ac').innerHTML=
    '<div class="row" style="justify-content:space-between"><h2>'+(up?'Create your account':'Welcome back')+'</h2><button class="btn x" data-ax="1" aria-label="Close">'+ic('x',16)+'</button></div>'+
    '<p class="wsub">'+(up?'Sign up to start building websites and apps with Forma.':'Log in to keep building.')+'</p>'+
    '<div class="seg"><button class="'+(up?'on':'')+'" data-am="up">Sign up</button><button class="'+(up?'':'on')+'" data-am="in">Log in</button></div>'+
    (up?'<label>Name</label><input type="text" id="an" autocomplete="name">':'')+
    '<label>Email</label><input type="email" id="ae" autocomplete="email" inputmode="email">'+
    '<label>Password</label><input type="password" id="ap" autocomplete="'+(up?'new-password':'current-password')+'" placeholder="'+(up?'At least 8 characters':'')+'">'+
    '<div class="aerr" id="aerr" role="alert"></div>'+
    '<button class="btn" data-sub="1">'+(up?'Create account':'Log in')+'</button>'+
    (configured
      ? '<div class="authsep">OR</div><button class="btn googlebtn" data-google="1">'+ic('user',17)+'Continue with Google</button>'+
        '<div class="verifybox" id="verifybox"></div>'+

  $('#auth').style.display='grid';

}

function closeAuth(cancel){
  $('#auth').style.display='none';
  if(cancel)pending=null;
}

async function localSubmit(up,em,pw,nm,fail){
  if(!(window.crypto&&crypto.subtle))return fail('Secure sign-in is not available in this browser.');
  const U=localUsers();let u;
  try{
    if(up){
      if(U[em])return fail('An account with this email already exists. Try logging in.');
      const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
      const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
      const hash=[...new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256))].map(x=>x.toString(16).padStart(2,'0')).join('');
      u=U[em]={name:nm,salt,hash};st.set('forma-users',U);
    }else{
      u=U[em];
      if(!u)return fail('No account was found with that email.');
      const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
      const hash=[...new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(u.salt),iterations:100000,hash:'SHA-256'},k,256))].map(x=>x.toString(16).padStart(2,'0')).join('');
      if(hash!==u.hash)return fail('Incorrect email or password.');
    }
  }catch(err){return fail('Could not complete sign-in. Please try again.')}
  me=em;st.set('forma-session',em);acct();closeAuth();
  toast((up?'Welcome to Forma, ':'Welcome back, ')+u.name.split(' ')[0]);
  const f=pending;pending=null;if(f)f();
}

async function submit(){
  if(authBusy)return;
  const up=am==='up',
    em=$('#ae')?.value.trim().toLowerCase()||'',
    pw=$('#ap')?.value||'',
    nm=up?($('#an')?.value.trim()||''):'',
    er=$('#aerr'),
    fail=m=>{if(er)er.textContent=m};

  if(er)er.textContent='';
  if(up&&!nm)return fail('Please enter your name.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return fail('Enter a valid email address.');
  if(pw.length<8)return fail(up?'Use at least 8 characters for your password.':'Enter your password.');

  authBusy=true;
  const btn=$('#ac [data-sub]');
  if(btn){btn.disabled=true;btn.textContent=up?'Creating account...':'Logging in...'}

  try{
    if(!firebaseReady())return await localSubmit(up,em,pw,nm,fail);

    if(up){
      const cred=await formaAuth.createUserWithEmailAndPassword(em,pw);
      if(nm)await cred.user.updateProfile({displayName:nm});
      try{await cred.user.sendEmailVerification()}catch(x){console.warn('Verification email failed:',x)}
      firebaseUser=cred.user;
      me=cred.user.uid;st.set('forma-session',me);
      acct();
      closeAuth();
      toast('Account created. Check your email to verify it.');
    }else{
      const cred=await formaAuth.signInWithEmailAndPassword(em,pw);
      firebaseUser=cred.user;
      me=cred.user.uid;st.set('forma-session',me);
      if(!cred.user.emailVerified){
        await cred.user.sendEmailVerification().catch(()=>{});
        if(er)er.textContent='Your email is not verified yet. We sent another verification email.';
        const vb=$('#verifybox');
        if(vb){vb.style.display='block';vb.textContent='Check your inbox for the Firebase verification email, then log in again.'}
        await formaAuth.signOut();
        firebaseUser=null;me=null;st.set('forma-session',null);
        return;
      }
      acct();closeAuth();toast('Welcome back, '+(cred.user.displayName||em.split('@')[0])+'!');
    }
    const f=pending;pending=null;if(f)f();
  }catch(err){
    fail(authError(err));
  }finally{
    authBusy=false;
    const b=$('#ac [data-sub]');
    if(b){b.disabled=false;b.textContent=up?'Create account':'Log in'}
  }
}

async function googleSignIn(){
  if(authBusy)return;
  const er=$('#aerr'),fail=m=>{if(er)er.textContent=m};
  if(!firebaseReady())return fail(window.FORMA_IS_EMBEDDED?'Google sign-in is disabled in the embedded preview. Host Forma normally to use Google sign-in.':'Firebase is still loading. Please try again in a moment.');
  authBusy=true;
  const b=$('#ac [data-google]');
  if(b){b.disabled=true;b.textContent='Connecting to Google...'}
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const result=await formaAuth.signInWithPopup(provider);
    firebaseUser=result.user;
    me=result.user.uid;st.set('forma-session',me);
    acct();closeAuth();
    toast('Welcome to Forma, '+(result.user.displayName||result.user.email?.split('@')[0]||'there')+'!');
    const f=pending;pending=null;if(f)f();
  }catch(err){
    fail(authError(err));
  }finally{
    authBusy=false;
    const x=$('#ac [data-google]');
    if(x){x.disabled=false;x.innerHTML=ic('user',17)+'Continue with Google'}
  }
}

async function logout(){
  try{if(firebaseReady())await formaAuth.signOut()}catch(err){console.warn('Sign-out failed:',err)}
  firebaseUser=null;me=null;st.set('forma-session',null);
  S={mode:'site',name:'',logo:'sparkles',theme:{},sections:[],sel:-1};
  timer.forEach(clearTimeout);setMode();draw();$('#ttl').textContent='Preview';acct();goHome();toast('Logged out');
}

if(firebaseReady()){
  formaAuth.onAuthStateChanged(user=>{
    firebaseUser=user||null;
    me=user?user.uid:null;
    if(user)st.set('forma-session',user.uid);else st.set('forma-session',null);
    acct();
  });
}
